<script type="module">

function pLight(x, y, z, c, i, d) {

// ═══ PROSEDÜREL DOKULAR ═══
function cnv(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; }
function tex(c) {
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  return t;
}
function rgb(hex){ return [parseInt(hex.slice(1,3),16), parseInt(hex.slice(3,5),16), parseInt(hex.slice(5,7),16)]; }
function shade(hex, v){ const c = rgb(hex).map(x => Math.max(0, Math.min(255, Math.round(x + v)))); return `rgb(${c[0]},${c[1]},${c[2]})`; }
function mix(a, b, t){ const A = rgb(a), B = rgb(b); const c = A.map((x, i) => Math.round(x + (B[i] - x) * t)); return `rgb(${c[0]},${c[1]},${c[2]})`; }

function concreteTex(base, stains) {
  const [c, x] = cnv(256, 256);
  x.fillStyle = base; x.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 2600; i++) {
    x.fillStyle = Math.random() < 0.5 ? 'rgba(0,0,0,0.05)' : 'rgba(255,255,255,0.045)';
    x.fillRect(Math.random() * 256, Math.random() * 256, 1.6, 1.6);
  }
  for (let i = 0; i < stains; i++) {
    const sx = Math.random() * 256, w = 6 + Math.random() * 26;
    const g = x.createLinearGradient(0, 0, 0, 256);
    g.addColorStop(0, 'rgba(18,18,20,0.25)'); g.addColorStop(1, 'rgba(18,18,20,0)');
    x.fillStyle = g; x.fillRect(sx, 0, w, 256);
  }
  return tex(c);
}
function tileTex(base) {
  const [c, x] = cnv(256, 256);
  x.fillStyle = '#43454a'; x.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 8; i++) for (let j = 0; j < 8; j++) {
    x.fillStyle = shade(base, (Math.random() - 0.5) * 16);
    x.fillRect(i * 32 + 2, j * 32 + 2, 28, 28);
    x.fillStyle = 'rgba(255,255,255,0.04)';
    x.fillRect(i * 32 + 2, j * 32 + 2, 28, 2);
  }
  return tex(c);
}
function cladTex(base) {
  const [c, x] = cnv(256, 256);
  x.fillStyle = base; x.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 8; i++) {
    x.fillStyle = shade(base, (Math.random() - 0.5) * 10);
    x.fillRect(i * 32 + 1, 0, 30, 256);
    x.fillStyle = 'rgba(0,0,0,0.35)'; x.fillRect(i * 32, 0, 2, 256);
    x.fillStyle = 'rgba(255,255,255,0.08)'; x.fillRect(i * 32 + 30, 0, 2, 256);
  }
  for (let i = 0; i < 500; i++) { x.fillStyle = 'rgba(0,0,0,0.05)'; x.fillRect(Math.random() * 256, Math.random() * 256, 2, 1); }
  return tex(c);
}
function asphaltTex() {
  const [c, x] = cnv(256, 256);
  x.fillStyle = '#2a2e35'; x.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 4200; i++) {
    x.fillStyle = Math.random() < 0.6 ? 'rgba(0,0,0,0.09)' : 'rgba(255,255,255,0.03)';
    x.fillRect(Math.random() * 256, Math.random() * 256, 1.5, 1.5);
  }
  for (let i = 0; i < 7; i++) {
    const g = x.createRadialGradient(Math.random() * 256, Math.random() * 256, 4, 128, 128, 90);
    g.addColorStop(0, 'rgba(10,11,14,0.35)'); g.addColorStop(1, 'rgba(10,11,14,0)');
    x.fillStyle = g; x.fillRect(0, 0, 256, 256);
  }
  return tex(c);
}
function grateTex() {
  const [c, x] = cnv(64, 64);
  x.fillStyle = '#17191d'; x.fillRect(0, 0, 64, 64);
  for (let i = 0; i < 8; i++) { x.fillStyle = '#07080a'; x.fillRect(i * 8 + 2, 2, 4, 60); }
  return tex(c);
}
function shutterTex() {
  const [c, x] = cnv(128, 256);
  x.fillStyle = '#484c54'; x.fillRect(0, 0, 128, 256);
  for (let y = 0; y < 256; y += 12) {
    x.fillStyle = 'rgba(255,255,255,0.13)'; x.fillRect(0, y, 128, 3);
    x.fillStyle = 'rgba(0,0,0,0.38)'; x.fillRect(0, y + 8, 128, 4);
  }
  for (let i = 0; i < 6; i++) {
    const sx = Math.random() * 128;
    const g = x.createLinearGradient(0, 0, 0, 256);
    g.addColorStop(0, 'rgba(96,52,28,0.0)'); g.addColorStop(1, 'rgba(96,52,28,0.3)');
    x.fillStyle = g; x.fillRect(sx, 100, 3 + Math.random() * 5, 156);
  }
  return tex(c);
}
function woodTex() {
  const [c, x] = cnv(128, 128);
  x.fillStyle = '#453322'; x.fillRect(0, 0, 128, 128);
  for (let i = 0; i < 5; i++) {
    x.fillStyle = shade('#453322', (Math.random() - 0.5) * 18);
    x.fillRect(i * 26 + 1, 0, 24, 128);
    x.fillStyle = 'rgba(0,0,0,0.4)'; x.fillRect(i * 26, 0, 2, 128);
  }
  for (let i = 0; i < 40; i++) { x.fillStyle = 'rgba(0,0,0,0.12)'; x.fillRect(Math.random() * 128, Math.random() * 128, 1, 8 + Math.random() * 20); }
  return tex(c);
}
function metalDoorTex() {
  const [c, x] = cnv(128, 128);
  x.fillStyle = '#26292f'; x.fillRect(0, 0, 128, 128);
  x.strokeStyle = 'rgba(255,255,255,0.09)'; x.lineWidth = 3; x.strokeRect(10, 6, 108, 116);
  x.fillStyle = '#101216'; x.fillRect(44, 16, 40, 22);
  for (let i = 0; i < 300; i++) { x.fillStyle = 'rgba(0,0,0,0.08)'; x.fillRect(Math.random() * 128, Math.random() * 128, 2, 1); }
  return tex(c);
}
function laundryTex() { // canvas döndürür — çağıran tex() ile sarar
  const [c, x] = cnv(128, 256);
  const g = x.createLinearGradient(0, 0, 0, 256);
  g.addColorStop(0, '#0e2833'); g.addColorStop(1, '#1d5064');
  x.fillStyle = g; x.fillRect(0, 0, 128, 256);
  for (let i = 0; i < 3; i++) {
    x.fillStyle = '#0a1a22'; x.beginPath(); x.arc(24 + i * 40, 180, 13, 0, 7); x.fill();
    x.fillStyle = '#7fd8ef'; x.beginPath(); x.arc(24 + i * 40, 180, 8, 0, 7); x.fill();
  }
  x.fillStyle = 'rgba(160,235,255,0.25)'; x.fillRect(0, 40, 128, 30);
  x.fillStyle = '#0b0d10';
  x.fillRect(60, 0, 8, 256); x.fillRect(0, 118, 128, 6);
  return c;
}
function interiorTex(v) {
  const [c, x] = cnv(128, 128);
  if (v === 3) {
    x.fillStyle = '#0a0d12'; x.fillRect(0, 0, 128, 128);
    x.fillStyle = '#7fb8ff'; x.fillRect(34, 44, 60, 40);
    x.fillStyle = 'rgba(127,184,255,0.25)'; x.fillRect(0, 30, 128, 70);
  } else {
    const g = x.createLinearGradient(0, 0, 0, 128);
    g.addColorStop(0, '#5a3816'); g.addColorStop(1, '#9a6a2e');
    x.fillStyle = g; x.fillRect(0, 0, 128, 128);
    x.fillStyle = 'rgba(30,16,6,0.85)';
    if (v === 0) x.fillRect(0, 0, 34, 128);
    if (v === 1) { x.fillRect(94, 0, 34, 128); x.beginPath(); x.arc(40, 96, 14, 0, 7); x.arc(52, 104, 10, 0, 7); x.fill(); }
    if (v === 2) x.fillRect(0, 84, 128, 10);
    x.fillStyle = 'rgba(255,220,160,0.35)'; x.fillRect(0, 0, 128, 26);
  }
  x.fillStyle = '#0d0f13';
  x.fillRect(60, 0, 8, 128); x.fillRect(0, 60, 128, 8);
  return c;
}
function vendingTex(kind) {
  const [c, x] = cnv(128, 256);
  x.fillStyle = kind === 'red' ? '#5a0d0d' : '#22303c'; x.fillRect(0, 0, 128, 256);
  x.fillStyle = kind === 'red' ? '#d02020' : '#2a8fc8'; x.fillRect(0, 0, 128, 44);
  x.fillStyle = '#fff'; x.font = `700 26px ${FONT}`; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText(kind === 'red' ? 'ドリンク' : 'のみもの', 64, 23);
  const cans = ['#e33', '#3af', '#fa3', '#3f6', '#f6f', '#ff9', '#9ff', '#fc6'];
  for (let r = 0; r < 4; r++) for (let i = 0; i < 3; i++) {
    x.fillStyle = cans[(r * 3 + i) % 8];
    x.fillRect(14 + i * 36, 58 + r * 34, 26, 24);
    x.fillStyle = 'rgba(255,255,255,0.35)'; x.fillRect(14 + i * 36, 58 + r * 34, 26, 5);
  }
  x.fillStyle = '#0c0e12'; x.fillRect(0, 210, 128, 46);
  x.fillStyle = 'rgba(255,255,255,0.12)'; x.fillRect(10, 222, 60, 12);
  return c;
}
function lanternTex() {
  const [c, x] = cnv(64, 64);
  const g = x.createLinearGradient(0, 0, 0, 64);
  g.addColorStop(0, '#e8b86a'); g.addColorStop(0.5, '#ffd9a0'); g.addColorStop(1, '#d89a4e');
  x.fillStyle = g; x.fillRect(0, 0, 64, 64);
  x.fillStyle = 'rgba(120,60,20,0.35)';
  for (let y = 8; y < 64; y += 12) x.fillRect(0, y, 64, 2);
  return c;
}
function drawGlow(x, txt, font, px, py, color, blur) {
  x.font = font; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.save();
  x.shadowColor = color; x.shadowBlur = blur; x.fillStyle = color;
  x.fillText(txt, px, py);
  x.shadowBlur = blur / 2.5; x.fillStyle = mix(color, '#ffffff', 0.72);
  x.fillText(txt, px, py);
  x.restore();
}
function neonCanvas(o) {
  const W = o.W, H = o.H;
  const [c, x] = cnv(W, H);
  x.fillStyle = o.bg || '#0a0a10'; x.fillRect(0, 0, W, H);
  if (o.flip) { x.save(); x.translate(W, 0); x.scale(-1, 1); }
  if (o.border) {
    x.strokeStyle = o.border; x.lineWidth = 6;
    x.shadowColor = o.border; x.shadowBlur = 9;
    x.strokeRect(9, 9, W - 18, H - 18);
    x.shadowBlur = 0;
  }
  const chars = [...o.text];
  if (o.vertical) {
    const subH = o.sub ? H * 0.13 : 0;
    const cell = (H - subH - H * 0.03) / chars.length;
    const fs = Math.min(cell * 0.86, W * 0.86);
    chars.forEach((ch, i) => drawGlow(x, ch, `700 ${fs}px ${FONT}`, W / 2, H * 0.015 + cell * (i + 0.5), o.color, 9));
    if (o.sub) {
      const sfs = Math.min(H * 0.07, (W * 0.9) / o.sub.length);
      drawGlow(x, o.sub, `700 ${sfs}px ${FONT}`, W / 2, H - subH / 2, o.color, 7);
    }
  } else {
    const fs = Math.min(H * 0.58, (W * 0.94) / chars.length);
    drawGlow(x, o.text, `700 ${fs}px ${FONT}`, W / 2, o.sub ? H * 0.38 : H / 2, o.color, 9);
    if (o.sub) drawGlow(x, o.sub, `700 ${H * 0.2}px ${FONT}`, W / 2, H * 0.78, o.color, 7);
  }
  if (o.flip) x.restore();
  return c;
}
// ıslak asfalt neon çizgisi dokusu
function streakCanvas() {
  const [c, x] = cnv(64, 256);
  const g = x.createLinearGradient(0, 0, 0, 256);
  g.addColorStop(0, 'rgba(255,255,255,0.95)');
  g.addColorStop(0.35, 'rgba(255,255,255,0.45)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = g; x.fillRect(0, 0, 64, 256);
  x.globalCompositeOperation = 'destination-in';
  const g2 = x.createLinearGradient(0, 0, 64, 0);
  g2.addColorStop(0, 'rgba(0,0,0,0)');
  g2.addColorStop(0.5, 'rgba(0,0,0,1)');
  g2.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = g2; x.fillRect(0, 0, 64, 256);
  return c;
}
function ringCanvas() {
  const [c, x] = cnv(64, 64);
  x.strokeStyle = 'rgba(255,255,255,0.9)';
  x.lineWidth = 5;
  x.shadowColor = 'rgba(255,255,255,0.8)'; x.shadowBlur = 6;
  x.beginPath(); x.arc(32, 32, 22, 0, 7); x.stroke();
  return c;
}
function blobCanvas() {
  const [c, x] = cnv(64, 64);
  const g = x.createRadialGradient(32, 32, 2, 32, 32, 30);
  g.addColorStop(0, 'rgba(255,255,255,0.85)');
  g.addColorStop(0.6, 'rgba(255,255,255,0.3)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = g; x.fillRect(0, 0, 64, 64);
  x.globalCompositeOperation = 'destination-out';
  for (let i = 0; i < 7; i++) {
    const g2 = x.createRadialGradient(Math.random() * 64, Math.random() * 64, 0, 32, 32, 30);
    g2.addColorStop(0, 'rgba(0,0,0,0.35)'); g2.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = g2; x.fillRect(0, 0, 64, 64);
  }
  return c;
}
// birikinti maskesi: x∈[-45,45], z∈[-45,60] → 1024px (siyah=asfalt, beyaz=su)
function puddleMaskCanvas() {
  const [c, x] = cnv(1024, 1024);
  x.fillStyle = '#000'; x.fillRect(0, 0, 1024, 1024);
  const W2U = 1024 / 90, V2U = 1024 / 105;
  const toU = wx => (wx + 45) * W2U, toV = wz => (wz + 45) * V2U;
  function blob(wx, wz, r, squash = 0.7) {
    const u = toU(wx), v = toV(wz), rp = r * W2U;
    for (let i = 0; i < 3; i++) {
      const ox = (Math.random() - 0.5) * rp * 0.7, oy = (Math.random() - 0.5) * rp * 0.5;
      const rr = rp * (0.55 + Math.random() * 0.45);
      const g = x.createRadialGradient(u + ox, v + oy, rr * 0.25, u + ox, v + oy, rr);
      g.addColorStop(0, 'rgba(255,255,255,0.95)');
      g.addColorStop(0.75, 'rgba(255,255,255,0.75)');
      g.addColorStop(1, 'rgba(255,255,255,0)');
      x.save(); x.translate(u + ox, v + oy); x.scale(1, squash); x.translate(-u - ox, -v - oy);
      x.fillStyle = g;
      x.beginPath(); x.arc(u + ox, v + oy, rr, 0, 7); x.fill();
      x.restore();
    }
  }
  for (const z of [30.5, 26, 21, 15.5, 10, 4.5, -1, -6.5, -12, -17.5, -22.5]) blob((Math.random() - 0.5) * 1.6, z, 1.0 + Math.random() * 0.9);
  blob(0.3, 27.5, 1.15); blob(-0.4, 24, 1.2);
  for (const px of [-5, -11, -17, -21.5]) blob(px, -28 + (Math.random() - 0.5), 0.9 + Math.random() * 0.7);
  for (const px of [5, 11, 17]) blob(px, -9.5, 0.7 + Math.random() * 0.5);
  blob(24.5, -9, 1.2); blob(26, -12, 0.9);
  for (const px of [-30, -18, -8, 2, 12, 24, 33]) blob(px, 36.5 + Math.random() * 4, 1.4 + Math.random() * 1.3);
  blob(0, 33.2, 1.6); blob(20, 35, 1.4);
  return c;
}

// ═══ MALZEMELER ═══
const std = o => new THREE.MeshStandardMaterial(o);
function signMats(o) {
  const mk = c => std({ map: tex(neonCanvas(c)), emissiveMap: tex(neonCanvas(c)), emissive: 0xffffff, emissiveIntensity: o.i || 1.75, roughness: 0.45, metalness: 0.1 });
  return { f: mk({ ...o }), b: mk({ ...o, flip: true }) };
}
const MATS = {
  conc:  std({ map: concreteTex('#787b80', 7), roughness: 0.92 }),
  concD: std({ map: concreteTex('#565a60', 10), roughness: 0.94 }),
  concW: std({ map: concreteTex('#7d7468', 8), roughness: 0.92 }),
  tileW: std({ map: tileTex('#b5afa2'), roughness: 0.5 }),
  tileG: std({ map: tileTex('#93a292'), roughness: 0.5 }),
  tileB: std({ map: tileTex('#ab9c8c'), roughness: 0.5 }),
  clad:  std({ map: cladTex('#6f767f'), roughness: 0.5, metalness: 0.5 }),
  drain: std({ map: grateTex(), roughness: 0.5, metalness: 0.7 }),
  metal: std({ color: 0x6d7076, roughness: 0.45, metalness: 0.8 }),

function fitUV(geo, sx, sy, sz, s = 0.5) {
  const uv = geo.attributes.uv, n = geo.attributes.normal;
  for (let i = 0; i < uv.count; i++) {
    const nx = Math.abs(n.getX(i)), ny = Math.abs(n.getY(i));
    let u = uv.getX(i), v = uv.getY(i);
    if (nx > 0.5) { u *= sz * s; v *= sy * s; }
    else if (ny > 0.5) { u *= sx * s; v *= sz * s; }
    else { u *= sx * s; v *= sy * s; }
    uv.setXY(i, u, v);
  }
}
function matOf(m) { return typeof m === 'string' ? MATS[m] : m; }
function box(cx, cy, cz, sx, sy, sz, o = {}) {
  const geo = new THREE.BoxGeometry(sx, sy, sz);
  if (o.fit) fitUV(geo, sx, sy, sz);
  const m = new THREE.Mesh(geo, o.mat ? matOf(o.mat) : MATS.conc);
  m.position.set(cx, cy, cz);
  m.castShadow = o.cast ?? true;
  m.receiveShadow = true;
  world.add(m);
  if (o.solid) colliders.push({ x0: cx - sx/2, x1: cx + sx/2, z0: cz - sz/2, z1: cz + sz/2, y0: cy - sy/2, y1: cy + sy/2 });
  return m;
}
function cyl(cx, cy, cz, r, h, o = {}) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, 14), o.mat ? matOf(o.mat) : MATS.metal);
  m.position.set(cx, cy, cz);
  if (o.axis === 'x') m.rotation.z = Math.PI / 2;
  if (o.axis === 'z') m.rotation.x = Math.PI / 2;
  m.castShadow = o.cast ?? true;
  m.receiveShadow = true;
  world.add(m);
  if (o.solid) colliders.push({ x0: cx - r, x1: cx + r, z0: cz - r, z1: cz + r, y0: cy - h/2, y1: cy + h/2 });
  return m;
}
function mass(x0, x1, z0, z1, h, o = {}) {
  return box((x0 + x1) / 2, h / 2, (z0 + z1) / 2, x1 - x0, h, z1 - z0, { solid: true, fit: true, ...o });
}
function wire(ax, ay, az, bx, by, bz, sag = 0.6) {
  const mid = new THREE.Vector3((ax + bx) / 2, Math.min(ay, by) - sag, (az + bz) / 2);
  const curve = new THREE.QuadraticBezierCurve3(new THREE.Vector3(ax, ay, az), mid, new THREE.Vector3(bx, by, bz));
  const geo = new THREE.TubeGeometry(curve, Math.max(10, Math.round(curve.getLength() * 0.8)), 0.022, 5);
  const m = new THREE.Mesh(geo, MATS.wire);
  m.castShadow = false;
  world.add(m);
}
function h01(n) { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }

const maskTex = new THREE.CanvasTexture(puddleMaskCanvas());
maskTex.wrapS = maskTex.wrapT = THREE.ClampToEdgeWrapping;
const reflRT = new THREE.WebGLRenderTarget(1024, 1024);

const reflTexMatrix = new THREE.Matrix4();

const groundMat = new THREE.MeshStandardMaterial({ map: asphaltTex(), roughness: 0.95 });
let groundShader = null;
groundMat.onBeforeCompile = sh => {
  sh.uniforms.tReflect = { value: reflRT.texture };
  sh.uniforms.texMatrix = { value: reflTexMatrix };
  sh.uniforms.tMask = { value: maskTex };
  sh.uniforms.time = { value: 0 };
  groundShader = sh;
  sh.vertexShader = sh.vertexShader
    .replace('#include <common>', '#include <common>\nvarying vec3 vWPos;')
    .replace('#include <worldpos_vertex>', '#include <worldpos_vertex>\nvWPos = (modelMatrix * vec4(transformed, 1.0)).xyz;');
  sh.fragmentShader = sh.fragmentShader
    .replace('#include <common>', `#include <common>
      varying vec3 vWPos;
      uniform sampler2D tReflect; uniform mat4 texMatrix; uniform sampler2D tMask; uniform float time;
      vec2 hash22(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * vec3(0.1031, 0.1030, 0.0973)); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.xx + p3.yz) * p3.zy); }
      vec2 rippleGrad(vec2 p, float t){
        vec2 acc = vec2(0.0);
        vec2 g = floor(p);
        for(int j = -1; j <= 1; j++) for(int i = -1; i <= 1; i++){
          vec2 cell = g + vec2(float(i), float(j));
          vec2 rnd = hash22(cell);
          vec2 center = cell + rnd;
          float ph = fract(t * 0.55 + rnd.x * 9.1 + rnd.y * 3.3);
          float d = length(p - center);
          float r = ph * 1.4;
          float band = exp(-22.0 * abs(d - r)) * (1.0 - ph) * sign(d - r);
          acc += (p - center) / max(d, 1e-3) * band;
        }
        return acc;
      }`)
    .replace('#include <map_fragment>', `#include <map_fragment>
      vec2 mUv = (vWPos.xz - vec2(-45.0, -45.0)) / vec2(90.0, 105.0);
      float puddle = texture2D(tMask, mUv).r;
      diffuseColor.rgb *= (1.0 - puddle * 0.62);`)
    .replace('#include <roughnessmap_fragment>', `#include <roughnessmap_fragment>
      roughnessFactor = mix(roughnessFactor, 0.07, puddle);`)
    .replace('vec3 outgoingLight = reflectedLight.directDiffuse + reflectedLight.indirectDiffuse + totalEmissiveRadiance;',
      `vec3 outgoingLight = reflectedLight.directDiffuse + reflectedLight.indirectDiffuse + totalEmissiveRadiance;
      {
        vec4 ruv = texMatrix * vec4(vWPos, 1.0);
        vec2 suv = ruv.xy / ruv.w;
        vec2 rg = rippleGrad(vWPos.xz * 2.2, time);
        suv += rg * 0.009 * puddle;
        vec3 refl = texture2D(tReflect, suv).rgb;
        vec3 vdir = normalize(cameraPosition - vWPos);
        float cosT = clamp(vdir.y, 0.0, 1.0);
        float F = 0.02 + 0.98 * pow(1.0 - cosT, 5.0);
        float mirr = clamp(F * 1.3 + 0.28, 0.0, 1.0) * puddle;
        outgoingLight = outgoingLight * (1.0 - 0.35 * mirr) + refl * mirr * 1.0;
        outgoingLight += refl * F * 0.05 * (1.0 - puddle);
      }`);
};

  vertexShader: `
    attribute float tip;
    uniform float time; uniform vec3 camPos;
    varying float vA;
    void main(){
      vec3 size = vec3(34.0, 22.0, 34.0);
      vec3 p = position * size;
      float speed = 21.0;
      float y = mod(p.y - time * speed, size.y);
      float fell = (size.y - y) / speed;
      vec2 xz = p.xz + vec2(-2.6, 1.1) * fell;
      xz = mod(xz, size.xz);
      vec3 base = vec3(camPos.x + xz.x - 17.0, y, camPos.z + xz.y - 17.0);
      vec3 vel = normalize(vec3(-2.6, -speed, 1.1));
      base += vel * tip * 0.55;
      float d = length(xz - vec2(17.0));
      vA = (1.0 - smoothstep(9.0, 16.0, d)) * 0.30;
      gl_Position = projectionMatrix * viewMatrix * vec4(base, 1.0);
    }`,
  fragmentShader: `varying float vA; void main(){ gl_FragColor = vec4(0.62, 0.72, 0.9, vA); }`,

const blobTex = tex(blobCanvas());
function steam(x0, z0, tint) {
  const N = 42;
  const pos = new Float32Array(N * 3);
  const seed = new Float32Array(N);
  for (let i = 0; i < N; i++) seed[i] = Math.random();
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('seed', new THREE.BufferAttribute(seed, 1));
  const m = new THREE.ShaderMaterial({
    uniforms: { time: { value: 0 }, tMap: { value: blobTex }, tint: { value: new THREE.Color(tint) }, pixelRatio: { value: Math.min(devicePixelRatio, 2) } },
    vertexShader: `
      attribute float seed;
      uniform float time; uniform float pixelRatio;
      varying float vA;
      void main(){
        float life = fract(time * (0.20 + seed * 0.14) + seed * 7.0);
        vec3 p = position;
        p.x += sin(seed * 40.0 + time * 0.7 + life * 5.0) * (0.12 + life * 0.55);
        p.z += cos(seed * 31.0 + time * 0.5 + life * 4.0) * (0.10 + life * 0.45);
        p.y += 0.15 + life * 3.4;
        vA = smoothstep(0.0, 0.15, life) * (1.0 - smoothstep(0.5, 1.0, life)) * 0.32;
        vec4 mv = modelViewMatrix * vec4(p, 1.0);
        gl_PointSize = (24.0 + life * 130.0) * pixelRatio / max(1.0, -mv.z);
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `
      uniform sampler2D tMap; uniform vec3 tint;
      varying float vA;
      void main(){ vec4 t = texture2D(tMap, gl_PointCoord); gl_FragColor = vec4(tint, t.a * vA); }`,
    transparent: true, blending: THREE.NormalBlending, depthWrite: false,
  });
  const p = new THREE.Points(g, m);
  p.position.set(x0, 0, z0);
  p.frustumCulled = false;
  scene.add(p);
  box(x0, 0.03, z0, 0.55, 0.06, 0.55, { mat: 'metalD', cast: false });
  return m;
}

    const t = mkGlow(0xff2a22, 1.1); t.position.set(-2.15, 0.8, dz); carGroup.add(t);
  }
  const pool = new THREE.Mesh(new THREE.PlaneGeometry(9, 3.5),
    new THREE.MeshBasicMaterial({ map: blobTex, color: 0xcfe0ff, transparent: true, opacity: 0.18, blending: THREE.AdditiveBlending, depthWrite: false }));
  pool.rotation.x = -Math.PI / 2;
  pool.position.set(4.5, 0.05, 0);
  carGroup.add(pool);
}
const carLight = new THREE.PointLight(0xcfe0ff, 0, 13, 1.6);
carGroup.add(carLight);
carLight.position.set(2.5, 0.8, 0);
carGroup.visible = false;

// ═══ UZAKTAN TREN ═══
const trainMesh = (() => {
  const [c, x] = cnv(256, 24);
  x.fillStyle = 'rgba(255,190,120,0.95)';
  for (let i = 0; i < 9; i++) x.fillRect(8 + i * 28, 6, 16, 12);
  const t = tex(c);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(11, 0.7),
    new THREE.MeshBasicMaterial({ map: t, color: 0xffc888, transparent: true, opacity: 0.55, blending: THREE.AdditiveBlending, depthWrite: false, fog: false }));
  m.position.set(0, 18.5, 60);
  m.visible = false;
  scene.add(m);
  return m;
})();

// ═══ RÜZGARDA YUVARLANAN POŞET ═══
const trash = new THREE.Mesh(new THREE.IcosahedronGeometry(0.16, 0), MATS.trash);
trash.scale.y = 0.7;
trash.castShadow = true;
scene.add(trash);

// ═══ AYNA PASS: gizlenecekler ═══
const mirrorHidden = [rain, splash, streakGroup, shaftGroup, hazeGroup, carGroup, trainMesh, trash];
function renderReflection() {
  mirrorCam.position.copy(camera.position);
  mirrorCam.position.y *= -1;
  const look = new THREE.Vector3();
  camera.getWorldDirection(look);
  look.y *= -1;
  const up = new THREE.Vector3(0, 1, 0).applyQuaternion(camera.quaternion);
  up.y *= -1;
  mirrorCam.up.copy(up);
  mirrorCam.lookAt(mirrorCam.position.x + look.x, mirrorCam.position.y + look.y, mirrorCam.position.z + look.z);
  mirrorCam.fov = camera.fov; mirrorCam.aspect = camera.aspect;
  mirrorCam.near = camera.near; mirrorCam.far = camera.far;
  mirrorCam.updateProjectionMatrix();
  reflTexMatrix.set(0.5, 0, 0, 0.5, 0, 0.5, 0, 0.5, 0, 0, 0.5, 0.5, 0, 0, 0, 1);
  reflTexMatrix.multiply(mirrorCam.projectionMatrix);
  reflTexMatrix.multiply(mirrorCam.matrixWorldInverse);
  ground.visible = false;
  for (const o of mirrorHidden) o.visible = false;
  const prev = renderer.getRenderTarget();
  renderer.setRenderTarget(reflRT);
  renderer.render(scene, mirrorCam);
  renderer.setRenderTarget(prev);
  ground.visible = true;
  for (const o of mirrorHidden) o.visible = true;
  if (carGroup.userData.active !== true) carGroup.visible = false;
  if (!trainMesh.userData.active) trainMesh.visible = false;
}

// ═══ BLOOM ═══
const composer = new EffectComposer(renderer);
composer.setPixelRatio(Math.min(devicePixelRatio, 2));
composer.setSize(innerWidth, innerHeight);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.42, 0.5, 0.85);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// ═══ OYUNCU ═══
const player = { x: 0.5, z: -6.5, yaw: 0.02, pitch: 0.04, vx: 0, vz: 0, bob: 0 };
const qparams = new URLSearchParams(location.search);
const qp = qparams.get('p');
if (qp) {
  const [x, z, yaw, pitch] = qp.split(',').map(Number);
  if (!isNaN(x)) player.x = x;
  if (!isNaN(z)) player.z = z;
  if (!isNaN(yaw)) player.yaw = yaw;
  if (!isNaN(pitch)) player.pitch = pitch;
}

const keys = new Set();
addEventListener('keydown', e => keys.add(e.code));
addEventListener('keyup', e => keys.delete(e.code));
addEventListener('blur', () => keys.clear());

let locked = false;
const hint = document.getElementById('hint');
renderer.domElement.addEventListener('click', () => { if (!drone.active) renderer.domElement.requestPointerLock(); });
document.addEventListener('pointerlockchange', () => {
  locked = document.pointerLockElement === renderer.domElement;
  hint.style.opacity = locked ? 0 : 1;
});
addEventListener('mousemove', e => {
  if (!locked || drone.active) return;
  player.yaw -= e.movementX * 0.0023;
  player.pitch = Math.max(-1.45, Math.min(1.45, player.pitch - e.movementY * 0.0023));
});

const STEP_OVER = 0.45, HEAD = 1.65, R = CFG.radius;
function slide(dx, dz) {
  let nx = player.x + dx, nz = player.z + dz;
  for (const c of colliders) {
    if (c.y1 <= STEP_OVER || c.y0 >= HEAD) continue;
    if (nx > c.x0 - R && nx < c.x1 + R && nz > c.z0 - R && nz < c.z1 + R) {
      if (dx > 0) nx = Math.min(nx, c.x0 - R); else if (dx < 0) nx = Math.max(nx, c.x1 + R);
      if (dz > 0) nz = Math.min(nz, c.z0 - R); else if (dz < 0) nz = Math.max(nz, c.z1 + R);
    }
  }
  player.x = nx; player.z = nz;
}

function step(dt) {
  const run = keys.has('ShiftLeft') || keys.has('ShiftRight');
  const sp = run ? CFG.run : CFG.walk;
  let ix = 0, iz = 0;
  if (locked && !drone.active) {
    if (keys.has('KeyW') || keys.has('ArrowUp')) iz += 1;
    if (keys.has('KeyS') || keys.has('ArrowDown')) iz -= 1;
    if (keys.has('KeyA') || keys.has('ArrowLeft')) ix -= 1;
    if (keys.has('KeyD') || keys.has('ArrowRight')) ix += 1;
  }
  const sy = Math.sin(player.yaw), cy = Math.cos(player.yaw);
  let wx = -sy * iz + cy * ix;
  let wz = -cy * iz - sy * ix;
  const l = Math.hypot(wx, wz) || 1;
  const on = ix !== 0 || iz !== 0;
  const tx = (wx / l) * sp * (on ? 1 : 0);
  const tz = (wz / l) * sp * (on ? 1 : 0);
  const k = 1 - Math.exp(-10 * dt);
  player.vx += (tx - player.vx) * k;
  player.vz += (tz - player.vz) * k;
  slide(player.vx * dt, 0);
  slide(0, player.vz * dt);
  const spd = Math.hypot(player.vx, player.vz);
  player.bob += dt * spd * 1.7;
  const bobY = Math.sin(player.bob * 2) * 0.02 * Math.min(spd / CFG.walk, 1);
  camera.position.set(player.x, CFG.eye + bobY, player.z);
  camera.rotation.y = player.yaw;
  camera.rotation.x = player.pitch;
}

// ═══ DRONE TURU ═══
const drone = { active: false, t: 0, dur: 60 };
const droneBtn = document.getElementById('droneBtn');
const dronePos = new THREE.CatmullRomCurve3([
  [11, 8.5, 46], [4, 4.2, 37], [0.6, 2.4, 29], [-0.7, 2.5, 19], [0.6, 2.2, 9],
  [-0.6, 2.4, 0], [0.6, 2.3, -9], [0.2, 2.5, -16], [-0.3, 2.7, -21.2], [-2.5, 2.5, -26.5],
  [-9, 2.3, -28], [-15, 2.8, -28], [-11, 6, -26.5], [-5, 13, -18], [0, 18, -4],
  [3, 15, 14], [7, 10, 34], [5, 4.5, 41],
].map(p => new THREE.Vector3(...p)), false, 'centripetal');
const droneTgt = new THREE.CatmullRomCurve3([
  [0, 2.5, 30], [0, 2.2, 28], [-1, 2.2, 20], [-1.5, 2.6, 12], [1.2, 3.0, 2],
  [1.4, 3.2, -6], [6, 2.0, -9.5], [-0.5, 3.0, -22], [-0.5, 3.2, -24], [0.5, 2.2, -26],
  [-14, 1.8, -28], [-24, 2.5, -28], [-14, 2.2, -27.5], [-1, 3, -21.5], [0.3, 1.5, 8],
  [0.5, 1.5, 22], [0, 2, 36], [-3, 1.8, 37],
].map(p => new THREE.Vector3(...p)), false, 'centripetal');

function startDrone(from = 0) {
  drone.active = true;
  drone.t = from;
  document.body.classList.add('cine');
  droneBtn.textContent = 'TURU DURDUR';
  if (document.pointerLockElement) document.exitPointerLock();
  camera.fov = 62;
  camera.updateProjectionMatrix();
}
function stopDrone() {
  drone.active = false;
  document.body.classList.remove('cine');
  droneBtn.textContent = 'DRONE TURU';
  camera.fov = CFG.fov;
  camera.updateProjectionMatrix();
  camera.rotation.order = 'YXZ';
}
droneBtn.addEventListener('click', () => drone.active ? stopDrone() : startDrone());
addEventListener('keydown', e => { if (e.code === 'Escape' && drone.active) stopDrone(); });

const _dp = new THREE.Vector3(), _dt2 = new THREE.Vector3(), _tan = new THREE.Vector3(), _tan2 = new THREE.Vector3();
function droneStep(dt) {
  if (!drone.active) return;
  drone.t += dt / drone.dur;
  if (drone.t >= 1) { stopDrone(); return; }
  const t = drone.t;
  const te = t * t * (3 - 2 * t);
  dronePos.getPointAt(te, _dp);
  droneTgt.getPointAt(te, _dt2);
  camera.position.copy(_dp);
  camera.lookAt(_dt2);
  // hafif yatış (banking) — yörünge eğriliğinden
  dronePos.getTangentAt(te, _tan);
  dronePos.getTangentAt(Math.min(1, te + 0.008), _tan2);
  const cross = _tan.x * _tan2.z - _tan.z * _tan2.x;
  camera.rotateZ(THREE.MathUtils.clamp(cross * 6, -0.05, 0.05));
}
const qDrone = qparams.get('drone');
if (qDrone !== null) startDrone(parseFloat(qDrone) || 0);

// ═══ GECE HAYATI ═══
let flT = 0;
function nightLife(dt, T) {
  flT += dt;
  if (flT < 0.09) return;
  flT = 0;
  tvMat.emissiveIntensity = 1.3 + Math.random() * 1.3;
  for (const m of flickerMats) m.emissiveIntensity = Math.random() < 0.14 ? 0.4 : 1.9;
}
function updateCar(T) {
  const cyc = 17, win = 7;
  const tt = T % cyc;
  const dir = Math.floor(T / cyc) % 2 === 0 ? 1 : -1;
  if (tt < win) {
    const p = tt / win;
    carGroup.visible = true;
    carGroup.userData.active = true;
    carGroup.position.set(dir > 0 ? -46 + 92 * p : 46 - 92 * p, 0, dir > 0 ? 38.7 : 37.4);
    carGroup.rotation.y = dir > 0 ? 0 : Math.PI;
    carLight.intensity = 7 * Math.sin(Math.PI * Math.min(1, p * 1.15));
  } else {
    carGroup.visible = false;
    carGroup.userData.active = false;
  }
}
function updateTrain(T) {
  const cyc = 47, win = 5.5;
  const tt = (T + 13) % cyc;
  if (tt < win) {
    trainMesh.visible = true;
    trainMesh.userData.active = true;
    trainMesh.position.x = -75 + 150 * (tt / win);
  } else {
    trainMesh.visible = false;
    trainMesh.userData.active = false;
  }
}
function updateTrash(T) {
  const p = (Math.sin(T * 0.09) + 1) / 2;
  const gust = 0.4 + 0.6 * Math.max(0, Math.sin(T * 0.5) * Math.sin(T * 0.13 + 2));
  trash.position.set(
    0.4 + Math.sin(T * 0.9) * 0.9 * gust,
    0.1 + Math.abs(Math.sin(T * 2.2)) * 0.45 * gust,
    28 - 46 * p
  );
  trash.rotation.x = T * 1.7;
  trash.rotation.z = T * 1.1;
}

// ═══ HUD ═══
const hud = document.getElementById('hud');
let ema = 1 / 60, acc = 0, frames = 0;
function updateHud(dt) {
  ema += (dt - ema) * 0.08;
  acc += dt; frames++;
  if (acc > 0.2 || frames <= 5) {
    acc = 0;
    const i = renderer.info.render;
    hud.textContent = `${Math.round(1 / ema)} FPS · ${(ema * 1000).toFixed(1)} ms\n${i.calls} draw call · ${(i.triangles / 1000).toFixed(1)}k üçgen`;
  }
}

// ═══ DÖNGÜ ═══
const clock = new THREE.Clock();
let T = 0;
function tick() {
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.05);
  T += dt;
  if (drone.active) droneStep(dt); else step(dt);
  nightLife(dt, T);
  updateCar(T);
  updateTrain(T);
  updateTrash(T);
  for (const h of hazeSprites) h.s.position.x += Math.sin(T * 0.12 + h.ph) * 0.0035;
  if (groundShader) groundShader.uniforms.time.value = T;
  rainMat.uniforms.time.value = T;
  rainMat.uniforms.camPos.value.copy(camera.position);
  splashMat.uniforms.time.value = T;
  splashMat.uniforms.camPos.value.copy(camera.position);
  steam1.uniforms.time.value = T;
  steam2.uniforms.time.value = T;
  renderReflection();
  renderer.info.reset();
  composer.render();
  updateHud(dt);
}
tick();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});
</script>
